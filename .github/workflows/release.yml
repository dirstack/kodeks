name: Release

# Kodeks releases itself with its own workflows. Pending changesets open or update the
# "Version Packages" pull request, and merging it publishes the new version. The workflows are
# called by path, so a release always runs the workflow files of the commit being released.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # A manual run can target any branch, so only main may version or publish.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/public-version.yml
    with:
      # The changelog module is this package's own build output.
      version-command: bun run build && bunx changeset version

  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/public-release.yml
    with:
      # CI does not run on the "Version Packages" pull request, so check again before publishing.
      build-command: bun run lint && bun run format:check && bun run typecheck && bun run test && bun run build
      # `bunx kodeks` would resolve the unrelated `kodeks` package on npm, not this repository.
      publish-command: node dist/cli/kodeks.js publish
