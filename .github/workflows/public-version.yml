# Reusable workflow for a private monorepo that publishes its public packages from a mirror.
# It only versions: when changesets are pending it opens or updates the "Version Packages"
# pull request. Merging that pull request bumps the versions on the default branch, the sync
# workflow mirrors them, and the mirror publishes them.
#
# The calling job must grant `contents: write` and `pull-requests: write`. A pull request
# opened with the default GITHUB_TOKEN starts no workflows, so CI does not run on it. Pass
# `github-token` (a GitHub App token or a fine-grained token) to have CI run on it.
name: Version public packages

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version. Empty reads `packageManager` from package.json.
        type: string
        default: ""
      install-command:
        description: Command that installs the monorepo's dependencies.
        type: string
        default: bun install --frozen-lockfile
      version-command:
        description: Command that applies the pending changesets.
        type: string
        default: bunx changeset version
      title:
        description: Title of the version pull request and its commit.
        type: string
        default: "chore: version packages"
    secrets:
      github-token:
        description: Token that opens the pull request. Defaults to GITHUB_TOKEN.
        required: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.github-token || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      # The registry occasionally fails mid-download, so the install gets three attempts.
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          for attempt in 1 2 3; do
            bash -c "$INSTALL_COMMAND" && exit 0
            echo "Install failed (attempt $attempt), retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Open or update the version pull request
        # v2 reads the `.changeset/pre/` directory that @changesets/cli 3 writes in pre mode;
        # v1 mistakes it for a legacy changeset and fails with ENOENT on `pre/changes.md`.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: ${{ inputs.version-command }}
          commit-message: ${{ inputs.title }}
          pr-title: ${{ inputs.title }}
          github-token: ${{ secrets.github-token || github.token }}
